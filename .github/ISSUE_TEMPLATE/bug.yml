name: Bug report
description: Something behaved wrongly in real use
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
      placeholder: |
        I picked a date from the calendar, saved, and the transaction landed on today.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings shows it at the bottom of the screen.
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where
      options:
        - iPhone, installed to home screen
        - iPhone, Safari tab
        - Android, installed
        - Android, browser tab
        - Desktop browser
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: App language
      placeholder: "Russian"
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
      description: |
        A screenshot helps a great deal for anything visual. **Cover or crop your amounts and
        account names first** — this is a public issue tracker and nobody here needs your balances.
