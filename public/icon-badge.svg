<!-- The app mark as a status-bar badge for Android notifications: the three bars of icon.svg alone,
     white on transparent, cropped to them. Android uses only the alpha channel and tints it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="116 132 280 280" width="96" height="96">
  <g fill="#FFFFFF">
    <rect x="136" y="300" width="64" height="88"  rx="32"/>
    <rect x="224" y="228" width="64" height="160" rx="32"/>
    <rect x="312" y="156" width="64" height="232" rx="32"/>
  </g>
</svg>
